[project]
name = "financial-data-lake"
version = "0.1.0"
description = "Projet EFREI de data lake financier Raw, Staging et Curated"
readme = "README.md"
requires-python = ">=3.11,<3.13"
dependencies = [
    "boto3==1.34.34",
    "elasticsearch==8.12.1",
    "fastapi==0.110.0",
    "httpx==0.26.0",
    "minio==7.2.3",
    "numpy==1.26.4",
    "pandas==2.2.0",
    "psycopg2-binary==2.9.9",
    "pydantic==2.6.1",
    "python-multipart==0.0.9",
    "scikit-learn==1.4.0",
    "uvicorn[standard]==0.27.1",
    "yfinance==1.4.1",
]

[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]

[dependency-groups]
dev = [
    "pytest==8.4.1",
    "reportlab==4.4.2",
]

[tool.pytest.ini_options]
pythonpath = ["src", "api"]
testpaths = ["tests"]
